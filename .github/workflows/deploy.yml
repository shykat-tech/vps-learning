name: Deploy to VPS

on:
  push:
    branches:
      -main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script:
            cd /home/dev/node_vps
            git pull origin main
            npm install
            sudo systemctl restart node_vps
            sudo systemctl status node_vps --no-pager
